<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TEAL 4 LIFE — Official 90s Boy Band Shrine</title>

<style>
:root{
  --mint-teal:#9ae2d1;
  --soft-pink:#f2a2d4;
  --lavender:#9b82bc;
  --deep-teal:#149b9b;
  --white:#ffffff;
  --ink:#1f1f1f;
  --butter:#fff6a6;
}

*{box-sizing:border-box}

body{
  background-color:var(--soft-pink);
  background-image:
    linear-gradient(45deg,
      var(--soft-pink) 25%,
      var(--lavender) 25%,
      var(--lavender) 50%,
      var(--soft-pink) 50%,
      var(--soft-pink) 75%,
      var(--lavender) 75%,
      var(--lavender) 100%);
  background-size:100px 100px;
  font-family:"Arial Black", system-ui, Arial, sans-serif;
  margin:0;
  padding:32px 16px;
}

.main-card{
  background:var(--mint-teal);
  border:8px solid var(--white);
  box-shadow:15px 15px 0 var(--lavender);
  max-width:860px;
  margin:0 auto 24px auto;
  padding:24px;
  position:relative;
}

header{
  border-bottom:4px solid var(--white);
  padding-bottom:12px;
}

h1{
  color:white;
  text-shadow:3px 3px 0 var(--lavender);
  margin:0;
  font-style:italic;
}

.sub-header{
  color:var(--lavender);
  margin-top:6px;
}

.blink{
  background:var(--butter);
  padding:2px 6px;
  border:2px dashed var(--lavender);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

.hero-banner{
  margin:16px 0;
  border:4px solid white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:10px 10px 0 var(--lavender);
  cursor:pointer;
}

.hero-banner img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.marquee-bar{
  background:var(--lavender);
  color:white;
  padding:10px;
  margin:16px -24px;
}

.content-grid{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:16px;
}

@media(max-width:900px){
  .content-grid{grid-template-columns:1fr}
}

.info-box{
  background:white;
  border:3px solid var(--lavender);
  padding:14px;
}

.track{
  background:white;
  padding:12px;
  margin-bottom:10px;
  border-left:10px solid var(--lavender);
}

button{
  background:var(--deep-teal);
  color:white;
  border:none;
  padding:10px 16px;
  font-family:"Arial Black", system-ui, Arial, sans-serif;
  box-shadow:4px 4px 0 var(--lavender);
  cursor:pointer;
}

.gallery-title{
  color:white;
  text-shadow:2px 2px 0 var(--lavender);
  margin-bottom:10px;
}

.polaroid-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

@media(max-width:980px){
  .polaroid-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .polaroid-grid{grid-template-columns:1fr}
}

.polaroid{
  background:white;
  padding:10px 10px 28px;
  box-shadow:10px 10px 0 rgba(155,130,188,.55);
  transform:rotate(var(--rot,-2deg));
}

.polaroid img{
  width:100%;
  height:200px;
  object-fit:cover;
  display:block;
}

.cap{
  text-align:center;
  margin-top:8px;
  font-family:"Comic Sans MS","Arial Black",sans-serif;
}
</style>
</head>

<body>

<!-- MAIN CONTENT -->
<div class="main-card">

  <header>
    <h1>TEAL 4 LIFE</h1>
    <div class="sub-header">
      Official 90s Boy Band Shrine <span class="blink">NEW!</span>
    </div>
  </header>

  <div class="hero-banner" id="heroBanner">
    <img src="https://drive.google.com/thumbnail?id=1nADiKjpjmgcDXi1wI8LHnyK7IZtGFOAE&sz=w2000" alt="TEAL 4 LIFE band photo">
  </div>

  <div class="marquee-bar">
    <marquee behavior="alternate" scrollamount="8">
      *** TOUR BUS RUNS ON VIBES ONLY *** TEAL IS A LIFESTYLE ***
    </marquee>
  </div>

  <div class="content-grid">
    <div class="info-box">
      <strong>THE BAND</strong><br>
      Because teal never dies. It just… moisturizes.
    </div>

    <div>
      <div class="track">
        <strong>01. Chains & Gains</strong><br>
        <button>PLAY NOW</button>
      </div>
      <div class="track">
        <strong>02. 18 Holes but only one heart</strong><br>
        <button>PLAY NOW</button>
      </div>
      <div class="track">
        <strong>03. Summer ’25</strong><br>
        <button>PLAY NOW</button>
      </div>
      <div class="track">
        <strong>04. The Takeover</strong><br>
        <button>PLAY NOW</button>
      </div>
    </div>
  </div>

</div>

<!-- GALLERY CARD -->
<div class="main-card">
  <h2 class="gallery-title">📸 Polaroid Gallery</h2>
  <div class="polaroid-grid" id="polaroidGrid"></div>
</div>

<script>
const PHOTOS=[
 {id:"1nADiKjpjmgcDXi1wI8LHnyK7IZtGFOAE",cap:"Teal Destiny"},
 {id:"1R9DWazAdY-swkUzdT398cjFfqZfD7zco",cap:"Synchronised Smoulder"},
 {id:"1lR56oAIK0eg8pCzZx2hWZnlye6gwGAwX",cap:"Hydrated Harmony"}
];

const grid=document.getElementById("polaroidGrid");
grid.innerHTML=PHOTOS.map(p=>`
  <div class="polaroid" style="--rot:${(Math.random()*8-4).toFixed(1)}deg">
    <a href="https://drive.google.com/file/d/${p.id}/view" target="_blank">
      <img src="https://drive.google.com/thumbnail?id=${p.id}&sz=w1200">
    </a>
    <div class="cap">${p.cap}</div>
  </div>
`).join("");

document.getElementById("heroBanner")
  .addEventListener("click",()=>window.open(
    "https://drive.google.com/file/d/1nADiKjpjmgcDXi1wI8LHnyK7IZtGFOAE/view",
    "_blank"
  ));
</script>

</body>
</html>
